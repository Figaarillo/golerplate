basePath: /api
definitions:
  entity.Category:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      products:
        items:
          $ref: '#/definitions/entity.Product'
        type: array
      updated_at:
        type: string
    type: object
  entity.Order:
    properties:
      created_at:
        type: string
      id:
        type: string
      products:
        items:
          $ref: '#/definitions/entity.Product'
        type: array
      status:
        type: string
      total:
        type: number
      updated_at:
        type: string
      user:
        $ref: '#/definitions/entity.User'
      user_id:
        type: string
    required:
    - status
    - user_id
    type: object
  entity.Product:
    properties:
      category:
        $ref: '#/definitions/entity.Category'
      category_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      price:
        minimum: 0
        type: number
      stock:
        minimum: 0
        type: integer
      updated_at:
        type: string
    required:
    - category_id
    type: object
  entity.User:
    properties:
      age:
        maximum: 120
        minimum: 0
        type: integer
      created_at:
        type: string
      email:
        type: string
      firstname:
        type: string
      id:
        type: string
      lastname:
        type: string
      orders:
        items:
          $ref: '#/definitions/entity.Order'
        type: array
      password:
        minLength: 12
        type: string
      updated_at:
        type: string
    required:
    - email
    - firstname
    - lastname
    - password
    type: object
host: localhost:8080
info:
  contact:
    email: axel.leonardi.22@gmail.com
    name: Figarillo
  description: GOlerplate is boilerpalte for GO
